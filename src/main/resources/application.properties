spring.application.name=sms

# Render port binding & lightning-fast startup to prevent 502 timeouts
server.port=${PORT:10000}
spring.main.lazy-initialization=true

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.pool-name=SmsHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.error.include-message=never

sms.auth.jwt-secret=${SMS_JWT_SECRET}
sms.auth.access-token-minutes=${SMS_ACCESS_TOKEN_MINUTES:15}
